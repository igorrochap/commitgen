name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-semantic-release

      - id: current
        name: Verify main still points to the gated commit
        env:
          QUALITY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$main_sha" != "$QUALITY_SHA" ]]; then
            echo "Skipping release: main is at $main_sha, while the successful Quality run tested $QUALITY_SHA."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --force-create main "$QUALITY_SHA"
          echo 'release=true' >> "$GITHUB_OUTPUT"

      - if: steps.current.outputs.release == 'true'
        run: semantic-release version --no-push --no-vcs-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: candidate
        name: Push the version commit to a temporary branch
        if: steps.current.outputs.release == 'true'
        env:
          QUALITY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "$candidate_sha" == "$QUALITY_SHA" ]]; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo 'No semantic release was created.'
            exit 0
          fi

          release_tag="$(git describe --tags --exact-match "$candidate_sha")"
          candidate_branch="release-candidate-${GITHUB_RUN_ID}"
          git push origin "$candidate_sha:refs/heads/$candidate_branch"
          {
            echo 'created=true'
            echo "sha=$candidate_sha"
            echo "tag=$release_tag"
            echo "branch=$candidate_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Run Quality on the version commit
        if: steps.candidate.outputs.created == 'true'
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh workflow run quality.yml --ref "$CANDIDATE_BRANCH"

          deadline=$((SECONDS + 2400))
          quality_run_id=""
          while (( SECONDS < deadline )); do
            runs="$(gh run list \
              --workflow quality.yml \
              --branch "$CANDIDATE_BRANCH" \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId,headSha)"
            quality_run_id="$(jq -r --arg sha "$CANDIDATE_SHA" \
              '[.[] | select(.headSha == $sha)][0].databaseId // empty' <<<"$runs")"
            if [[ -n "$quality_run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$quality_run_id" ]]; then
            echo "Could not find the Quality run for candidate $CANDIDATE_SHA." >&2
            exit 1
          fi

          gh run watch "$quality_run_id" --exit-status

      - id: latest
        name: Confirm main still points to the gated commit
        if: steps.candidate.outputs.created == 'true'
        env:
          QUALITY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$main_sha" != "$QUALITY_SHA" ]]; then
            echo "Skipping release: main advanced to $main_sha before the version commit passed its gates."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"

      - if: steps.latest.outputs.release == 'true'
        name: Push the gated version commit and tag to main
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: git push --atomic origin "$CANDIDATE_SHA:refs/heads/main" "refs/tags/$RELEASE_TAG"

      - if: steps.latest.outputs.release == 'true'
        name: Create the GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes

      - if: steps.latest.outputs.release == 'true'
        run: semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: always() && steps.candidate.outputs.created == 'true'
        name: Remove the temporary release branch
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: git push origin --delete "$CANDIDATE_BRANCH" || true
